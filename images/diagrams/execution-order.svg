<text x="580" y="163" font-size="14" fill="#1d1811" text-anchor="middle" font-weight="700">1</text>
<text x="360" y="252" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="400">「右」是看物件在畫面上的位置——把物件拖到旁邊，程式行為就變了</text>
<defs><marker id="oa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a89f92"/></marker></defs></svg>
