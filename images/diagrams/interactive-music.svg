<text x="634" y="146" font-size="15" fill="#1d1811" text-anchor="middle" font-weight="700">C</text>
<line x1="494" y1="140" x2="506" y2="140" stroke="#a89f92" stroke-width="2" marker-end="url(#ga)"/>
<line x1="582" y1="140" x2="594" y2="140" stroke="#a89f92" stroke-width="2" marker-end="url(#ga)"/>
<rect x="510" y="200" width="72" height="40" rx="5" fill="#6fbfae" opacity="0.55"/>
<text x="546" y="226" font-size="15" fill="#1d1811" text-anchor="middle" font-weight="700">B′</text>
<path d="M470,162 Q470,200 506,214" fill="none" stroke="#6fbfae" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#gt)"/>
<text x="430" y="214" font-size="11.5" fill="#6fbfae" text-anchor="end" font-weight="400">狀態改變</text>
<line x1="422" y1="272" x2="670" y2="272" stroke="#3a3026" stroke-width="1.5"/>
<text x="546" y="290" font-size="12" fill="#6fbfae" text-anchor="middle" font-weight="400">切換只發生在小節線上，才不會難聽</text>
<defs><marker id="ga" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a89f92"/></marker><marker id="gt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6fbfae"/></marker></defs></svg>
