<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img">
<rect width="720" height="330" rx="10" fill="#1d1811"/>
<text x="360" y="32" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">互動音樂的兩種基本手法</text>
<text x="176" y="66" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">垂直重混 Vertical Remixing</text>
<text x="176" y="86" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">時間軸不變，改變「厚度」</text>
<text x="58" y="125" font-size="12" fill="#a89f92" text-anchor="end" font-weight="400">獨奏</text>
<rect x="66" y="110" width="52" height="24" rx="4" fill="none" opacity="1" stroke="#3a3026" stroke-width="1" stroke-dasharray="3 3"/>
