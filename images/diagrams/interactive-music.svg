<rect x="182" y="110" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="240" y="110" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<text x="58" y="159" font-size="12" fill="#a89f92" text-anchor="end" font-weight="400">弦樂</text>
<rect x="66" y="144" width="52" height="24" rx="4" fill="none" opacity="1" stroke="#3a3026" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="124" y="144" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="182" y="144" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="240" y="144" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<text x="58" y="193" font-size="12" fill="#a89f92" text-anchor="end" font-weight="400">鼓</text>
<rect x="66" y="178" width="52" height="24" rx="4" fill="none" opacity="1" stroke="#3a3026" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="124" y="178" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="182" y="178" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="240" y="178" width="52" height="24" rx="4" fill="none" opacity="1" stroke="#3a3026" stroke-width="1" stroke-dasharray="3 3"/>
<text x="58" y="227" font-size="12" fill="#a89f92" text-anchor="end" font-weight="400">貝斯</text>
<rect x="66" y="212" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="124" y="212" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="182" y="212" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="240" y="212" width="52" height="24" rx="4" fill="#e0a94e" opacity="0.75" stroke="none" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="66" y1="252" x2="298" y2="252" stroke="#3a3026" stroke-width="1.5"/>
<text x="182" y="270" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">同一條時間軸 →</text>
<text x="182" y="296" font-size="12" fill="#6fbfae" text-anchor="middle" font-weight="400">戰鬥開始 → 鼓與弦樂淡入</text>
<line x1="360" y1="60" x2="360" y2="300" stroke="#3a3026" stroke-width="1"/>
<text x="542" y="66" font-size="14" fill="#e0a94e" text-anchor="middle" font-weight="600">水平重排 Horizontal Re-sequencing</text>
<text x="542" y="86" font-size="12" fill="#a89f92" text-anchor="middle" font-weight="400">改變「接下來播哪一段」</text>
<rect x="422" y="120" width="72" height="40" rx="5" fill="#e0a94e" opacity="0.7"/>
<text x="458" y="146" font-size="15" fill="#1d1811" text-anchor="middle" font-weight="700">A</text>
