<text x="192" y="256" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">外差原理</text>
<text x="192" y="272" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">不必碰觸</text>
<circle cx="296" cy="168" r="7.5" fill="#e0a94e"/>
