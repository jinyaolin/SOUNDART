<text x="296" y="118" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">Moog／Buchla</text>
<text x="296" y="134" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">模組化誕生</text>
<circle cx="400" cy="168" r="7.5" fill="#e0a94e"/>
