<text x="504" y="100" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="600">MIDI + DX7</text>
<text x="504" y="118" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">互通標準</text>
<text x="504" y="134" font-size="11" fill="#a89f92" text-anchor="middle" font-weight="400">與數位 FM</text>
<circle cx="608" cy="168" r="7.5" fill="#6fbfae"/>
