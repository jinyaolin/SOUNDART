<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img">
<rect width="720" height="320" rx="10" fill="#1d1811"/>
<text x="360" y="32" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">電子合成樂器：一百年的技術演進</text>
<line x1="46" y1="168" x2="674" y2="168" stroke="#3a3026" stroke-width="2"/>
<circle cx="88" cy="168" r="7.5" fill="#e0a94e"/>
