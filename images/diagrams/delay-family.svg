<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" font-family="-apple-system,'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif" role="img">
<rect width="720" height="268" rx="10" fill="#1d1811"/>
<text x="360" y="34" font-size="17" fill="#f0c87d" text-anchor="middle" font-weight="600">同一組延遲物件，時間長短決定它是哪一種效果</text>
<line x1="60" y1="148" x2="660" y2="148" stroke="#3a3026" stroke-width="2"/>
<rect x="64" y="114" width="136.0" height="30" rx="6" fill="#e0a94e" opacity="0.16"/>
<text x="132.0" y="135" font-size="13.5" fill="#f0c87d" text-anchor="middle" font-weight="600">梳狀濾波</text>
<text x="132.0" y="170" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">1–10 ms</text>
<text x="132.0" y="190" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">音色染色</text>
<rect x="208.0" y="114" width="124.0" height="30" rx="6" fill="#e0a94e" opacity="0.26"/>
<text x="270.0" y="135" font-size="13.5" fill="#f0c87d" text-anchor="middle" font-weight="600">鑲邊 Flanger</text>
<text x="270.0" y="170" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">1–10 ms + 調變</text>
<text x="270.0" y="190" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">呼嘯感</text>
<line x1="204.0" y1="110" x2="204.0" y2="154" stroke="#3a3026" stroke-width="1"/>
<rect x="340.0" y="114" width="136.0" height="30" rx="6" fill="#e0a94e" opacity="0.36"/>
<text x="408.0" y="135" font-size="13.5" fill="#f0c87d" text-anchor="middle" font-weight="600">合唱 Chorus</text>
<text x="408.0" y="170" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">20–40 ms</text>
<text x="408.0" y="190" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">變厚變寬</text>
<line x1="336.0" y1="110" x2="336.0" y2="154" stroke="#3a3026" stroke-width="1"/>
<rect x="484.0" y="114" width="172.0" height="30" rx="6" fill="#e0a94e" opacity="0.46"/>
<text x="570.0" y="135" font-size="13.5" fill="#f0c87d" text-anchor="middle" font-weight="600">回聲 Echo</text>
<text x="570.0" y="170" font-size="12" fill="#f2ece1" text-anchor="middle" font-weight="400">100 ms 以上</text>
<text x="570.0" y="190" font-size="11.5" fill="#a89f92" text-anchor="middle" font-weight="400">聽得出重複</text>
<line x1="480.0" y1="110" x2="480.0" y2="154" stroke="#3a3026" stroke-width="1"/>
<text x="60" y="216" font-size="12.5" fill="#a89f92" text-anchor="start" font-weight="400">短 ←</text>
<text x="660" y="216" font-size="12.5" fill="#a89f92" text-anchor="end" font-weight="400">→ 長（延遲時間）</text>
<text x="360" y="254" font-size="13" fill="#6fbfae" text-anchor="middle" font-weight="400">回授量務必小於 1，否則音量會無限累積</text>
</svg>
